<h2 align="center">DONOR REGISTRATION FORM</h2>
<script>
function validateDates() {
    let lastDonationDate = document.getElementById("last_donation_date").value;
    let donationDate = document.getElementById("donation_date").value;

    if (new Date(lastDonationDate) > new Date(donationDate)) {
        alert("Last Donation Date must be earlier than Donation Date.");
        return false;
    }
    return true;
}
</script>
<form onsubmit="return validateDates()" method="POST" action="register.php">
<table align="" cellpadding="25" cellspacing="0" border="1">
<tr>
<td>
<b> FULL NAME:</b></td>
<td><input type="text" name="full_name" pattern="[A-Za-z ]+" title="Name should contain letters and space is allowed between words" required></td>
</tr>
<tr>
<td>
<b>AGE:</b></td>
<td><input type="text" name="age" pattern="^(1[89]|[2-5][0-9]|6[0-5])$"  title="Age must be between 18 and 65" required>
</td>
</tr>
<tr>
<td>
<b>GENDER:</b></td>
<td>
<input type="radio" name="gender" value="Male" required>Male
<input type="radio" name="gender" value="Female" required>Female
<input type="radio" name="gender" value="Other" required>Other 
</td>
</tr>
<tr>
<td>
<b>BLOOD GROUP:</b></td>
<td>
<select name="blood_group" required>
<option value="" selected disabled hidden>Select BloodGroup</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>O+</option>
<option>O-</option>
<option>AB+</option>
<option>AB-</option>
</select>
</td>
</tr>
<tr>
<td >
<b>MOBILE NUMBER:</b></td>
<td><input type="tel" name="mobile_number" pattern="[6-9]{1}[0-9]{9}" maxlength="10" title="Please enter a valid 10-digit mobile number" required></td>
</tr>
<tr>
<td>
<b>CITY:</b></td>
<td><input type="text" name="city" pattern="[A-Za-z ]+" title=" City name  should contain letters and space is allowed between words" required></td>
</tr>
<tr>
<td>
<b>STATE:</b></td>
<td><input type="text" name="state" pattern="[A-Za-z ]+" title="State name  should contain letters and space is allowed between words" required></td>
</tr>
<tr>
<td>
<b>LAST DONATION DATE:</b></td>
<td><input type="date" id="last_donation_date" name="last_donation_date"></td>
</tr>
<tr>
<td>
<b>REGISTRATION DATE:</b></td>
<td><input type="date" id="donation_date" name="donation_date" readonly>
</td>
</tr>
<script>
document.getElementById("donation_date").value=new Date().toISOString().split('T')[0];
</script>
<tr>
<td>
<b>BLOOD DONATION CAMP</b>
</td>
<td>
<select name="camp_name" id="camp_name">
<option value="">--Select Camp (Optional)--</option>
<option value="Red Cross Mega Camp">Red Cross Mega Camp</option>
 <option value="Government Hospital Camp">Government Hospital Camp</option>
  <option value="College Blood Camp">College Blood Camp</option>
</select>
</td>
</tr>
<tr>
<td colspan="2" align="center" >
<input type="submit"  class="reg" value="Register">
</td>
</tr>
</table>
</form>
